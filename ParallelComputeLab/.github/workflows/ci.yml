name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (GCC Release)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libomp-dev python3 python3-pip python3-numpy python3-matplotlib

      - name: Configure CMake
        run: |
          cmake -B build/release -S ParallelComputeLab \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTS=ON \
            -DBUILD_BENCHMARKS=ON \
            -DENABLE_OPENMP=ON \
            -DENABLE_AVX2=ON

      - name: Build targets
        run: cmake --build build/release -j$(nproc)

      - name: Run Test Suite
        run: ctest --test-dir build/release --output-on-failure

      - name: Run Benchmark Smoke Test
        run: |
          mkdir -p ParallelComputeLab/results
          python3 ParallelComputeLab/scripts/run_benchmarks.py \
            --binary build/release/parallel_compute_benchmarks \
            --output-dir ParallelComputeLab/results \
            --repetitions 1 \
            --min-time 0.05 \
            --filter="BM_VectorAdd_Scalar/1024|BM_VectorAdd_SIMD/1024|BM_ReduceSum_Scalar/1024|BM_MatMul_Reference/64"

      - name: Validate Benchmark Results
        run: python3 ParallelComputeLab/scripts/validate_results.py ParallelComputeLab/results/raw_benchmark_results.json

      - name: Generate Analysis Report
        run: python3 ParallelComputeLab/scripts/analyze_results.py ParallelComputeLab/results/raw_benchmark_results.json ParallelComputeLab/results

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: ParallelComputeLab/results/

  sanitizers:
    name: Address & UndefinedBehavior Sanitizer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libomp-dev

      - name: Configure CMake (ASan + UBSan)
        run: |
          cmake -B build/asan -S ParallelComputeLab \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTS=ON \
            -DBUILD_BENCHMARKS=OFF \
            -DENABLE_ASAN_UBSAN=ON

      - name: Build tests
        run: cmake --build build/asan -j$(nproc)

      - name: Run ASan/UBSan tests
        run: ./build/asan/parallel_compute_tests

  portable-build:
    name: Portable Fallback (No AVX2)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libomp-dev

      - name: Configure CMake (Portable)
        run: |
          cmake -B build/portable -S ParallelComputeLab \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTS=ON \
            -DBUILD_BENCHMARKS=OFF \
            -DENABLE_AVX2=OFF

      - name: Build tests
        run: cmake --build build/portable -j$(nproc)

      - name: Run Portable tests
        run: ctest --test-dir build/portable --output-on-failure
